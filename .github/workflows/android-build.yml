name: Android build

# Builds the APK on GitHub's cloud runners (Android SDK is preinstalled on ubuntu-latest).
# Run it manually from the Actions tab ("Run workflow") or with:
#   gh workflow run android-build.yml -f ref=agents/voiceink4android
# then download the APK with:
#   gh run download --name <artifact-name>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build"
        required: false
        default: ""
      build_type:
        description: "debug (installable) or release (unsigned unless signing secrets are set)"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [master, beta-test-v1, "agents/**", "ci/**"]
  pull_request:

concurrency:
  group: android-build-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          # The repo has no gradlew script on master, so use the version from gradle-wrapper.properties directly.
          gradle-version: "8.14.5"

      - name: Point the build at the runner's Android SDK
        # The committed local.properties contains another machine's sdk.dir, which would break the build.
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Verification must pass before assembling an installable APK.
      - name: Verify edge cases and Android lint
        run: gradle testDebugUnitTest lintDebug --continue --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 30

  android-runtime:
    name: Android API ${{ matrix.api }} (${{ matrix.page_size }} byte pages)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
            page_size: 4096
          - api: 35
            target: google_apis_ps16k
            page_size: 16384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - name: Point the build at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Enable hardware accelerated Android emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android framework, native inference and long capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectedPageSize=${{ matrix.page_size }} --stacktrace
      - name: Upload Android runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Package verified APK
    needs: [verify, android-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      BUILD_REF: ${{ github.event.inputs.ref || github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - name: Point the build at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Install a stable debug keystore
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build APK after all verification gates pass
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then task=assembleRelease; else task=assembleDebug; fi
          gradle "$task" --stacktrace

      - name: Verify APK alignment for modern Android devices
        run: |
          for apk in app/build/outputs/apk/*/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done

      - name: Name the artifact
        id: meta
        run: |
          # Artifact names reject characters such as " : < > | * ? \ / that branch names may contain.
          safe_ref=$(printf '%s' "$BUILD_REF" | tr -c 'A-Za-z0-9._-' '-')
          echo "name=ToneTunner-${safe_ref}-$(git rev-parse --short HEAD)-${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
