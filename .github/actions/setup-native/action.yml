name: Build aligned native extensions
description: Rebuild and validate pinned ONNX Runtime Extensions Android JNI libraries in the cloud
runs:
  using: composite
  steps:
    - name: Test native artifact validation
      shell: bash
      run: python3 -m unittest discover -s tools/native -p 'test_*.py' -v
    - name: Cache aligned extensions AAR
      id: cache
      uses: actions/cache@v4
      with:
        path: native-dependencies/onnxruntime-extensions-android.aar
        key: aligned-extensions-${{ runner.os }}-${{ hashFiles('tools/native/*.py', '.github/actions/setup-native/action.yml') }}
    - name: Check out pinned upstream extensions sources
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: microsoft/onnxruntime-extensions
        ref: 9d5638b0b1f28ed2ca9ef589d5ec3ea86f859432
        path: native-source
        submodules: recursive
        persist-credentials: false
    - name: Install pinned Android NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: sdkmanager "ndk;28.2.13676358"
    - name: Rebuild upstream JNI libraries for all supported ABIs
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python3 tools/native/rebuild_extensions.py --source native-source \
          --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
          --output native-dependencies/onnxruntime-extensions-android.aar
    - name: Validate rebuilt or cached native libraries
      shell: bash
      run: python3 tools/native/check_alignment.py native-dependencies/onnxruntime-extensions-android.aar
