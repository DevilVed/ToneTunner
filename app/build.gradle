plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devilved.tonetunner'
    compileSdk 35

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        disable 'MissingTranslation'
        // Verification must reject lint errors before CI assembles an installable APK.
        abortOnError true
        sarifReport true
        htmlReport true
    }
    
    defaultConfig {
        applicationId "org.DevilVed.whisperplus"
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName "1.4"

    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    // Removed externalNativeBuild block

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }


    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.guava:guava:33.3.1-android'  // 31.1 had CVE-2020-8908 and CVE-2023-2976
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.9'
    implementation 'com.github.houbb:opencc4j:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    //ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'  //latest.release
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.12.4'   //latest.release

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'

}
