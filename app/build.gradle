plugins {
    id 'com.android.application'
}

def alignedExtensionsAar = rootProject.file('native-dependencies/onnxruntime-extensions-android.aar')
if (!alignedExtensionsAar.isFile()) {
    throw new GradleException("Missing aligned ONNX Runtime Extensions AAR at ${alignedExtensionsAar}. " +
            'Run: python3 tools/native/prepare_extensions.py --sdk "$ANDROID_HOME" ' +
            '--ndk "$ANDROID_HOME/ndk/27.2.12479018" ' +
            '--output native-dependencies/onnxruntime-extensions-android.aar\n' +
            'To supply inputs locally, also pass --source and --base-aar. See tools/native/README.md.')
}

android {
    namespace 'com.devilved.tonetunner'
    compileSdk 35
    buildToolsVersion '36.0.0'
    // Use the same toolchain as the native dependency build, including APK symbol stripping.
    ndkVersion '27.2.12479018'

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        disable 'MissingTranslation'
        // Verification must reject lint errors before CI assembles an installable APK.
        abortOnError true
        sarifReport true
        htmlReport true
        fatal 'Aligned16KB'
    }
    
    defaultConfig {
        applicationId "org.DevilVed.whisperplus"
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Removed externalNativeBuild block

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }


    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.google.guava:guava:33.3.1-android'  // 31.1 had CVE-2020-8908 and CVE-2023-2976
    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
    implementation 'com.github.houbb:opencc4j:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    //ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.27.0'
    // CI builds the upstream 0.13.0 native sources with 16 KB-compatible linker flags.
    // See tools/native/README.md; no unaligned fallback is packaged.
    implementation files(alignedExtensionsAar)

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

}
